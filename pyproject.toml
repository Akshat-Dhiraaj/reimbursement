[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slipguard"
version = "0.1.0"
description = "Reimbursement slip / invoice fraud detection — independent detectors selected by measured performance"
requires-python = ">=3.10"
dependencies = [
    "python-stdnum>=1.19",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Heavy, GPU-oriented deps for the Qwen2.5-VL image extractor. Kept out of the core
# install so `score`/`eval` stay dependency-free; only needed for the IMAGE route.
vlm = [
    "torch>=2.1",
    "torchvision",
    "transformers>=4.49",
    "accelerate>=0.26",
    "pillow>=10",
]
# The docTR OCR+KIE image extractor — the VLM's head-to-head rival on the IMAGE route.
# Apache-2.0, and reuses the same torch as [vlm]. Kept a separate extra so an OCR-only
# install skips the transformers/accelerate VLM stack (and vice versa).
ocr = [
    "python-doctr>=1.0",
    "torch>=2.1",
    "torchvision",
]
# Born-digital PDF text extraction (the PDF route's field reader). pypdfium2 is
# Apache-2.0 / BSD-3-Clause and bundles Google's PDFium (BSD-3-Clause) — no copyleft,
# no AGPL (we deliberately avoid PyMuPDF). Light and CPU-only, but kept optional so the
# core install stays dependency-free; the extractor reports it missing via available().
pdf = [
    "pypdfium2>=4",
]
# Deep PDF *forensics* (the provenance route's Layer 2): pikepdf decodes object/xref
# streams and XMP, so it recovers the editor tag / date gap that the byte scanner misses
# on modern compressed PDFs and surfaces structural anomalies (AcroForm, JavaScript,
# OpenAction, overlay annotations). MPL-2.0, a qpdf binding (~3 MB) — commercial-safe and
# deliberately NOT AGPL PyMuPDF. Separate from [pdf] (extraction): forensics and field
# reading are independent concerns. Optional; pdfmeta falls back to Layer 1 when absent.
pdf-forensics = [
    "pikepdf>=8",
]
# C2PA / Content Credentials reader (the IMAGE route's cryptographic-provenance signal):
# detects a signed AI-generated/edited assertion (Firefly/DALL-E/Sora/Imagen) or a signed
# camera capture. c2pa-python is MIT/Apache (bundles the Rust c2pa-rs), CPU-only and
# network-free for reads — but a heavy install (~260 MB of native wheels), so it is kept
# optional; image_meta abstains on this source when absent (falls back to EXIF).
c2pa = [
    "c2pa-python>=0.32",
]
# DSPy DEV-TIME prompt optimizer (src/slipguard/dspy_optimize.py) — NOT a runtime dependency.
# It tunes the extraction/validity prompt against the eval metric; any win is exported to a prompt
# file and production stays DSPy-free. MIT, but heavy (pulls litellm + optuna + openai), so it is a
# dev-only optional extra.
dspy = [
    "dspy>=3",
]
# Web UI backend — a thin FastAPI wrapper around the `validate` pipeline (src/slipguard/web/api.py),
# paired with the React drag-and-drop frontend in ./frontend. All commercial-safe: FastAPI (MIT),
# uvicorn (BSD-3-Clause), python-multipart (Apache-2.0). Kept optional so the core CLI install stays
# light; `slipguard serve` and the API import-guard on these and tell you to install .[web] if absent.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
slipguard = "slipguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
