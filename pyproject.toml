[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slipguard"
version = "0.1.0"
description = "Reimbursement slip / invoice fraud detection — independent detectors selected by measured performance"
requires-python = ">=3.10"
dependencies = [
    "python-stdnum>=1.19",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Heavy, GPU-oriented deps for the Qwen2.5-VL image extractor. Kept out of the core
# install so `score`/`eval` stay dependency-free; only needed for the IMAGE route.
vlm = [
    "torch>=2.1",
    "torchvision",
    "transformers>=4.49",
    "accelerate>=0.26",
    "pillow>=10",
]

[project.scripts]
slipguard = "slipguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
